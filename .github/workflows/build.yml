# 测试打包：只打安装包，不发 Release。打好的包在这次运行页面最下面的 Artifacts 里下载，保留 7 天。
# 触发：在 GitHub 的 Actions 页面选 build → Run workflow。正式发版用 release.yml。

name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
            rust_targets: ""
            bundle: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            bundle: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            args: ""
            rust_targets: ""
            bundle: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          # ARM64 Linux（飞腾、鲲鹏等），GitHub 给公开仓库免费提供 ARM 机器
          - os: ubuntu-22.04-arm
            name: linux-arm64
            args: ""
            rust_targets: ""
            bundle: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    environment: WULABEL_FEEDBACK_SECRET
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 编译依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          WULABEL_FEEDBACK_SECRET: ${{ secrets.WULABEL_FEEDBACK_SECRET }}
          # 全自动更新的签名私钥（和 tauri.conf.json 里的 pubkey 是一对），放在同一个 Environment 的 secrets 里
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: wulabel-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.bundle }}
          retention-days: 7
          if-no-files-found: error
